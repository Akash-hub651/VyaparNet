openapi: 3.0.3
info:
  title: VyaparNet Auth API
  version: 1.0.0
  description: Authentication & Identity endpoints

servers:
  - url: /api/v1

paths:
  /auth/otp/send:
    post:
      summary: Send OTP to phone number
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumber]
              properties:
                phoneNumber:
                  type: string
                  pattern: '^\+91[6-9][0-9]{9}$'
                  example: '+919876543210'
      responses:
        '200':
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/otp/verify:
    post:
      summary: Verify OTP and receive tokens
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumber, otp]
              properties:
                phoneNumber:
                  type: string
                  pattern: '^\+91[6-9][0-9]{9}$'
                otp:
                  type: string
                  pattern: '^[0-9]{6}$'
                deviceId:
                  type: string
      responses:
        '200':
          description: Tokens issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/AuthTokens'

  /auth/refresh:
    post:
      summary: Rotate refresh token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string, format: uuid }
      responses:
        '200':
          description: New token pair
        '401':
          description: Token revoked or expired

  /auth/logout:
    post:
      summary: Logout current session
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Logged out

  /auth/logout-all:
    post:
      summary: Logout all sessions
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: All sessions revoked

  /users/me:
    get:
      summary: Get current user profile
      tags: [Users]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User profile

    put:
      summary: Update user profile
      tags: [Users]
      security: [{ bearerAuth: [] }]

  /users/onboard:
    post:
      summary: Complete first-time onboarding
      tags: [Users]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardBusinessDto'
      responses:
        '201':
          description: Onboarding complete
        '409':
          description: Already onboarded

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AuthTokens:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string, format: uuid }
        expiresIn: { type: integer }
        tokenType: { type: string, enum: [Bearer] }

    SuccessResponse:
      type: object
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: object }
        requestId: { type: string }

    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, enum: [false] }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
        requestId: { type: string }

    OnboardBusinessDto:
      type: object
      required: [businessName, businessType, segment, city, state, pincode]
      properties:
        businessName: { type: string, minLength: 3 }
        businessType: { type: string, enum: [TEXTILE, SPARE_PARTS] }
        segment: { type: string, enum: [TEXTILE, SPARE_PARTS] }
        gstNumber: { type: string }
        city: { type: string }
        state: { type: string }
        pincode: { type: string, pattern: '^[1-9][0-9]{5}$' }
        language: { type: string, enum: [hi, en] }
